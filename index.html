@font-face{font-family:"Outfit";font-weight:500;font-display:swap;src:url(assets/fonts/outfit-latin-500-normal.woff2) format("woff2")}

/* Layout: una columna móvil de 440px máx. sobre Dark Morada sólido; silueta del isotipo sangrada como marca de agua. */
:root{
  /* Paleta Brandbook Ahead V1.0 */
  --dark-morada:#3B0B45;
  --morada:#5C1F63;
  --soft-lila:#EFEBFD;
  --cream:#F4F0E8;
  --naranja:#F76F26;
  --naranja-hover:#D8451D; /* Terracota, estado presionado */
  --line:rgba(239,235,253,.12);
  --muted:rgba(244,240,232,.72);

  /* Tipografía: Aeonik (titulares) cuando haya licencia web; mientras tanto Outfit. DM Sans (cuerpo). */
  --font-display:"Aeonik","Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;

  --radius-card:20px;
  --radius-pill:999px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--dark-morada)}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  /* Fondo: degradado vertical Dark Morada (arriba) → Morada (abajo) a lo largo de toda la página */
  background:linear-gradient(180deg,var(--dark-morada) 0%,var(--morada) 100%) var(--morada);
  color:var(--cream);
  font-family:var(--font-body);font-weight:300;font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.watermark{
  position:fixed;z-index:0;pointer-events:none;
  width:min(150vw,720px);right:max(-48vw,-240px);bottom:-18vh;
  fill:var(--dark-morada);opacity:.35;
}
main{
  position:relative;z-index:1;
  max-width:440px;margin:0 auto;
  padding-inline:20px;
  padding-block:calc(40px + env(safe-area-inset-top,0px)) calc(32px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:36px;
}

/* Encabezado */
header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
.logo{width:124px;height:auto;display:block}
h1{
  margin:0;font-family:var(--font-display);font-weight:600;
  font-size:clamp(28px,8vw,34px);line-height:1.08;letter-spacing:-.025em;
  text-wrap:balance;
}
.bajada{margin:-6px 0 0;max-width:34ch;color:var(--muted);font-size:15px;text-wrap:pretty}

/* Grupos */
section{display:flex;flex-direction:column;gap:12px}
.eyebrow{
  margin:0 0 2px 4px;font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
  color:var(--soft-lila);opacity:.7;
}

/* Botones principales (píldora) */
.btn{
  display:flex;align-items:center;gap:14px;
  min-height:68px;padding:10px 20px 10px 10px;border-radius:var(--radius-pill);
  text-decoration:none;color:var(--dark-morada);
  transition:transform .15s ease,background-color .15s ease;
  -webkit-tap-highlight-color:transparent;
}
.btn .ico{
  flex:none;width:48px;height:48px;border-radius:50%;
  display:grid;place-items:center;
}
.btn .ico svg{width:24px;height:24px}
.btn .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.btn .t{font-family:var(--font-display);font-weight:600;font-size:17px;line-height:1.2;letter-spacing:-.01em}
.btn .d{font-size:13px;line-height:1.35;opacity:.78}
.btn .go{flex:none;width:22px;height:22px;opacity:.7}

.btn.destacado{background:var(--naranja)}
.btn.destacado .ico{background:var(--dark-morada);fill:var(--naranja)}
.btn.destacado:active{background:var(--naranja-hover)}
.btn.claro{background:var(--cream)}
.btn.claro .ico{background:var(--morada);fill:var(--cream)}
.btn.claro:active{background:var(--soft-lila)}
.btn:active{transform:scale(.985)}

/* Lista de redes */
.lista{
  list-style:none;margin:0;padding:6px;
  background:rgba(239,235,253,.07);border:1px solid rgba(239,235,253,.10);border-radius:var(--radius-card);
  display:flex;flex-direction:column;
}
.lista li + li{position:relative}
.lista li + li::before{content:"";position:absolute;top:0;left:64px;right:16px;height:1px;background:var(--line)}
.red{
  display:flex;align-items:center;gap:14px;
  padding:12px 14px 12px 10px;border-radius:14px;
  color:var(--cream);text-decoration:none;
  transition:background-color .15s ease;-webkit-tap-highlight-color:transparent;
}
.red .ico{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(239,235,253,.08);fill:var(--soft-lila)}
.red .ico svg{width:20px;height:20px}
.red .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.red .t{font-weight:500;font-size:16px;line-height:1.25}
.red .d{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.red .go{flex:none;width:20px;height:20px;fill:var(--cream);opacity:.5}
.red:active{background:rgba(239,235,253,.08)}

a:focus-visible,button:focus-visible{outline:2px solid var(--naranja);outline-offset:3px}
@media (hover:hover){
  .btn.destacado:hover{background:#FF7F3A}
  .btn.claro:hover{background:#FFFFFF}
  .red:hover{background:rgba(239,235,253,.06)}
  .red:hover .go{opacity:.9}
}

/* Pie */
footer{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:4px}
.compartir{
  display:inline-flex;align-items:center;gap:8px;
  font:inherit;font-size:14px;font-weight:500;color:var(--cream);
  background:transparent;border:1px solid rgba(244,240,232,.35);border-radius:var(--radius-pill);
  padding:10px 18px;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.compartir svg{width:18px;height:18px;fill:currentColor}
.firma{margin:0;font-family:var(--font-display);font-weight:500;font-size:15px;letter-spacing:-.01em}
.legal{margin:-8px 0 0;font-size:12px;color:var(--muted)}

/* Entrada */
@media (prefers-reduced-motion:no-preference){
  .in{animation:subir .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 60ms)}
  @keyframes subir{from{transform:translateY(10px);opacity:.01}to{transform:none;opacity:1}}
}
</style>

(function(){
  var D = window.AHEAD || {grupos:[]};
  function svg(name, cls){
    var i = ICONS[name]; if(!i) return "";
    return '<svg class="'+(cls||"")+'" viewBox="'+i[0]+'" aria-hidden="true"><path d="'+i[1]+'"/></svg>';
  }
  function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

  if(D.frase) document.getElementById("frase").textContent = D.frase;
  var bj = document.getElementById("bajada");
  if(D.bajada) bj.textContent = D.bajada; else bj.hidden = true;
  if(D.firma) document.getElementById("firma").textContent = D.firma;
  document.getElementById("anio").textContent = new Date().getFullYear();
  document.getElementById("ico-share").setAttribute("d", ICONS.share[1]);

  var html = "", n = 1;
  (D.grupos||[]).forEach(function(g){
    var activos = (g.links||[]).filter(function(l){return l.estado==="activo" && l.url});
    if(!activos.length) return;
    var botones = activos.filter(function(l){return l.estilo!=="red"});
    var redes = activos.filter(function(l){return l.estilo==="red"});
    html += '<section class="in" style="--i:'+(n++)+'" aria-label="'+esc(g.titulo)+'">';
    if(g.titulo) html += '<p class="eyebrow">'+esc(g.titulo)+'</p>';
    botones.forEach(function(l){
      html += '<a class="btn '+esc(l.estilo)+'" href="'+esc(l.url)+'" target="_blank" rel="noopener">'
           +  '<span class="ico">'+svg(l.icono)+'</span>'
           +  '<span class="txt"><span class="t">'+esc(l.texto)+'</span>'+(l.detalle?'<span class="d">'+esc(l.detalle)+'</span>':'')+'</span>'
           +  svg("arrow","go")+'</a>';
    });
    if(redes.length){
      html += '<ul class="lista">';
      redes.forEach(function(l){
        html += '<li><a class="red" href="'+esc(l.url)+'" target="_blank" rel="noopener">'
             +  '<span class="ico">'+svg(l.icono)+'</span>'
             +  '<span class="txt"><span class="t">'+esc(l.texto)+'</span>'+(l.detalle?'<span class="d">'+esc(l.detalle)+'</span>':'')+'</span>'
             +  svg("arrow","go")+'</a></li>';
      });
      html += '</ul>';
    }
    html += '</section>';
  });
  document.getElementById("grupos").innerHTML = html;

  var btn = document.getElementById("compartir"), lbl = btn.querySelector("span");
  btn.addEventListener("click", function(){
    var url = location.href.split("#")[0];
    if(navigator.share){
      navigator.share({title:"Ahead", text:D.frase||"Ahead", url:url}).catch(function(){});
      return;
    }
    var ok = function(){ lbl.textContent = "Link copiado"; setTimeout(function(){lbl.textContent="Compartir"},2200) };
    if(navigator.clipboard) navigator.clipboard.writeText(url).then(ok, function(){ lbl.textContent = url });
    else lbl.textContent = url;
  });
})();
</script>
</body>
</html>
